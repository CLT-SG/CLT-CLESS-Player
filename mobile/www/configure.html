<!DOCTYPE html>
<html lang="us">

<head>
    <!-- Viewport meta for mobile (MUST come first) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta charset="utf-8">
    <title>eCLESS Player</title>
    <script>
        if (typeof module === 'object') {
            window.module = module
            module = undefined
        }
    </script>
    <!-- Latest compiled and minified CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">

    <!-- Latest compiled and minified JavaScript -->
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
    <!-- Enhanced configuration loader -->
    
    <!-- Custom Dialog System for alwaysOnTop compatibility -->
    <script src="assets/js/custom-dialog.js"></script>
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
        }

        .note {
            text-align: center;
            height: 80px;
            background: -webkit-linear-gradient(left, #0072ff, #8811c5);
            color: #fff;
            font-weight: bold;
            line-height: 80px;
        }

        .form-content {
            padding: 5%;
            border: 1px solid #ced4da;
            margin-bottom: 2%;
        }

        .btnSubmit {
            border: none;
            border-radius: 1.5rem;
            padding: 1%;
            width: 20%;
            cursor: pointer;
            background: #0062cc;
            color: #fff;
        }
    </style>
  
  <!-- Capacitor Mobile Initialization (MUST load first) -->
  <script type="module" src="assets/js/mobile/capacitor-core.bundle.js"></script>
  
  <!-- Mobile Electron Shim (provides window.mobileAPI, etc.) - NO DEFER -->
  <script src="assets/js/mobile/mobile-electron-shim.js"></script>
  
  <!-- Mobile Config Loader - NO DEFER (needs window.log from shim) -->
  <script src="assets/js/mobile/mobile-config.js"></script>
  
    <script>
        // Declare variables in global scope
        var ipcRenderer, remote, path, os, config, win, homedir;
        
        // Set up IPC listeners (defined before initializeAPIs calls it)
        function setupIPCListeners() {
            if (!ipcRenderer) {
                console.error('eCLESS: ipcRenderer not initialized, cannot set up listeners');
                return;
            }
            
            console.log('eCLESS: Setting up IPC listeners');
            
            // Listen for configuration save response from main process
            ipcRenderer.on('config-save-response', async (event, response) => {
                console.log('eCLESS: Configuration save response received:', response);
                
                if (response.success) {
                    // Show success dialog with auto-dismiss
                    await customAlert(
                        response.detail || response.message, 
                        { 
                            type: 'success',
                            title: 'Configuration Saved',
                            timeout: 5000,
                            buttonText: 'OK'
                        }
                    );
                    
                    // Restart the application after user acknowledges or timeout
                    console.log('eCLESS: CLESS Player relaunch initiated');
                    ipcRenderer.send('app-reload');
                } else {
                    // Show error dialog
                    await customAlert(
                        response.error || 'Failed to save configuration. Please try again.', 
                        { 
                            type: 'error',
                            title: 'Configuration Error',
                            timeout: 5000
                        }
                    );
                }
            });
        }
        
        // Initialize variables safely after shim loads
        function initializeAPIs() {
            if (!window.mobileAPI) {
                console.error('eCLESS: window.mobileAPI not available yet, retrying...');
                setTimeout(initializeAPIs, 100);
                return;
            }
            
            ipcRenderer = window.mobileAPI.ipc;
            remote = window.mobileAPI.remote;
            path = window.path;
            os = window.os;
            config = window.config;
            win = remote.getCurrentWindow(); // Fixed: use getCurrentWindow instead of getCurrentWebContents
            homedir = os.homedir();
            
            console.log('eCLESS: APIs initialized successfully');
            
            // Set up IPC listener after initialization
            setupIPCListeners();
        }
        
        // Call initialization immediately (after shim scripts have loaded)
        initializeAPIs();
        
        // Wait for configuration to load
        window.addEventListener('configLoaded', function(event) {
            console.log('eCLESS: Configuration loaded for configure window -', event.detail.source)
            // Note: Full config not logged to prevent exposing sensitive data (serial key)
            populateForm()
        })
        
        // Load configuration on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Check if config is already loaded
            if (window.configLoader && window.configLoader.config && typeof window.configLoader.getAll === 'function') {
                console.log('eCLESS: Configuration already loaded, populating form');
                populateForm();
            } else {
                console.log('eCLESS: Waiting for configuration to load...');
                // Start polling for config
                setTimeout(populateForm, 300);
            }
        })
        
        function populateForm() {
            // Wait for both configLoader and its config to be ready
            if (!window.configLoader) {
                console.warn('eCLESS: configLoader not available yet, retrying...');
                setTimeout(populateForm, 200);
                return;
            }
            
            if (!window.configLoader.config) {
                console.warn('eCLESS: configLoader.config not loaded yet, retrying...');
                setTimeout(populateForm, 200);
                return;
            }
            
            // Get all config using getAll() method or fallback to config object
            var configData = (typeof window.configLoader.getAll === 'function') 
                ? window.configLoader.getAll() 
                : window.configLoader.config;
            
            console.log('eCLESS: Populating form with configuration data');
            
            $('#hostserver').val(configData.hostserver || '')
            $('#dsid').val(configData.id || '')
            $('#mode option[value="' + (configData.mode || 'online') + '"]').prop("selected", true)
            $('#corsproxy option[value="' + (configData.corsproxy || 'N') + '"]').prop("selected", true)
            
            // Handle both old and new autostartup formats
            var autostartupValue
            if (configData.autoStartup !== undefined) {
                // New format (boolean)
                autostartupValue = configData.autoStartup ? 'Y' : 'N'
            } else {
                // Legacy format (string)
                autostartupValue = configData.autostartup || 'Y'
            }
            $('#autostartup option[value="' + autostartupValue + '"]').prop("selected", true)
            
            $('#serialkey').val(configData.serialkey || '')
            
            console.log('eCLESS: Form populated successfully with values:')
            console.log('  - Host server:', configData.hostserver)
            console.log('  - DS ID:', configData.id)
            console.log('  - Mode:', configData.mode)
            console.log('  - CORS Proxy:', configData.corsproxy)
            console.log('  - Auto startup:', autostartupValue)
            console.log('  - Serial key:', configData.serialkey ? '***' + configData.serialkey.slice(-8) : 'empty')
        }
    </script>
</head>

<body>
    <div class="container register-form" style="margin-top:10%;">
        <div class="form">
            <div class="note">
                <p>CLESS PLAYER - CONFIGURATION</p>
            </div>

            <div class="form-content">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>CLESS Server Address</div>
                            <input type="text" id="hostserver" class="form-control" value="" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>Digital Signage ID</div>
                            <input type="text" id="dsid" class="form-control" value="" type="number" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>Mode</div>
                            <select class="form-control" id="mode">
                                <option value="online">online</option>
                                <option value="offline">offline</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>Cors Proxy</div>
                            <select class="form-control" id="corsproxy">
                                <option value="Y">Enable</option>
                                <option value="N">Disable</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>Auto Startup</div>
                            <select class="form-control" id="autostartup">
                                <option value="Y">Enable</option>
                                <option value="N">Disable</option>
                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <div>License key</div>
                            <input type="text" id="serialkey" class="form-control" value="" />
                        </div>
                    </div>
                </div>
                <button type="button" class="btnSubmit" id="home">Exit</button>
                <button type="button" class="btnSubmit" id="save">Save</button>
            </div>
        </div>
    </div>
</body>
<script>
    // jQuery event handlers - set up after DOM is ready
    $(document).ready(function() {
        $('#save').on('click', app_config);
        $('#home').on('click', function () {
            console.log('eCLESS: Exit button clicked - reloading app');
            
            // For mobile, reload the app to apply any potential changes
            if (window.mobileAPI && window.mobileAPI.isNative) {
                // Native mobile - reload the app
                window.location.href = 'index.html';
            } else {
                // Web - simple reload
                window.location.href = 'index.html';
            }
        });
    });

    async function app_config() {
        var hostaddress = $('#hostserver').val()
        var dsid = $('#dsid').val()
        var mode = $('#mode').find(":selected").val()
        var corsproxy = $('#corsproxy').find(":selected").val()
        var autostartup = $('#autostartup').find(":selected").val()
        var serialkey = $('#serialkey').val()
        
        console.log('eCLESS: Saving configuration with values:')
        console.log('  - Host server:', hostaddress)
        console.log('  - DS ID:', dsid)
        console.log('  - Mode:', mode)
        console.log('  - CORS Proxy:', corsproxy)
        console.log('  - Auto startup:', autostartup)
        console.log('  - Serial key:', serialkey ? '***' + serialkey.slice(-8) : 'empty')
        
        // Create configuration object for mobile
        var configToSave = {
            version: window.configLoader.config.version || '2.6.5',
            hostserver: hostaddress,
            id: dsid,
            mode: mode,
            corsproxy: corsproxy,
            autostartup: autostartup,
            serialkey: serialkey,
            
            // Preserve enhanced settings from existing config
            syncSettings: window.configLoader.config.syncSettings || {
                enabled: false,
                role: 'none',
                masterIp: '',
                syncInterval: 5000,
                syncPort: 9000
            },
            masterServerAddress: window.configLoader.config.masterServerAddress || 'localhost',
            masterServerPort: window.configLoader.config.masterServerPort || 9000,
            displaySettings: window.configLoader.config.displaySettings || {
                orientation: 'landscape',
                fullscreen: true,
                hideStatusBar: true
            },
            networkSettings: window.configLoader.config.networkSettings || {
                timeout: 5000,
                retryAttempts: 3,
                offlineMode: true
            }
        };
        
        console.log('eCLESS: Configuration prepared for saving (serialkey masked)');
        
        try {
            // Save configuration using mobile config loader
            if (window.configLoader && typeof window.configLoader.saveConfiguration === 'function') {
                console.log('eCLESS: Saving configuration via mobile config loader...');
                
                // Show saving indicator
                $('#save').prop('disabled', true).text('Saving...');
                
                const saveResult = await window.configLoader.saveConfiguration(configToSave);
                
                console.log('eCLESS: Configuration saved successfully', saveResult);
                
                // Show success message
                alert('Configuration saved successfully! The app will now reload.');
                
                // Reload app after short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
                
            } else {
                console.error('eCLESS: Mobile config loader not available');
                alert('Error: Configuration system not initialized. Please restart the app.');
                $('#save').prop('disabled', false).text('Save');
            }
            
        } catch (error) {
            console.error('eCLESS: Error saving configuration:', error);
            alert('Failed to save configuration: ' + error.message);
            $('#save').prop('disabled', false).text('Save');
        }
    }
</script>

</html>
