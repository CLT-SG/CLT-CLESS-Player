<html lang="us">

<head>
    <meta charset="utf-8">
    <title>eCLESS Player</title>
    <script type="text/javascript" src="assets/js/cpanel/module.min.js"></script>
    <!-- Latest compiled and minified CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">

    <!-- Latest compiled and minified JavaScript -->
    <script type="text/javascript" src="/socket.io/socket.io.js"></script>
    <script type="text/javascript" src="assets/js/jquery.min.js"></script>
    <script type="text/javascript" src="assets/js/bootstrap.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
        }

        .note {
            text-align: center;
            height: 80px;
            background: -webkit-linear-gradient(left, #0072ff, #8811c5);
            color: #fff;
            font-weight: bold;
            line-height: 80px;
        }

        .title {
            text-align: left;
            font-size: 20px;
            color: black;
            font-weight: bold;
            line-height: 30px;
            width: auto;
        }

        .form-content {
            padding: 5%;
            border: 1px solid #ced4da;
            margin-bottom: 2%;
        }

        .ebutton {
            border: none;
            border-radius: 1.5rem;
            padding: 1%;
            cursor: pointer;
            background: #0062cc;
            color: #fff;
        }

        .ebutton:hover {
            border: none;
            border-radius: 1.5rem;
            padding: 1%;
            cursor: pointer;
            background: #5884b3;
            color: #fff;
        }
        .layout-name {
            font-weight:bold;
        }
    </style>
    <script type="text/javascript" src="assets/js/cpanel/require.min.js"></script>
</head>

<body>
    <div class="container register-form">
        <div class="form">
            <div class="note">
                <p>eCLESS PLAYER - CONTROL PANEL</p>
            </div>
            <div class="form-content">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <div class="title">
                                <p>Remote control</p>
                            </div>
                            <button type="button" class="btnRestart ebutton" id="refresh">Refresh</button>
                            <button type="button" class="btnReboot ebutton" id="restartapp">Restart App</button>
                            <button type="button" class="btnReboot ebutton" id="reboot">Reboot</button>
                            <button type="button" class="btnShutdown ebutton" id="shutdown">Shutdown</button>
                            <div style="width:885px;height:500px;">
                                <iframe id="remote-display" width="100%" height="100%"></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Change DS ID -->
            <div class="form-content">
                <div class="form-content">
                    <div class="row">
                        <div class="col-ld-6">
                            <div class="form-group">
                                <div class="title">
                                    <p>Change Layout</p>
                                    <div id="apiLayout">
                                    </div><br />
                                <div class="form-group">
                                    <div class="input-group">
                                        <input type="text" id="updateLytInput" class="form-control"
                                            placeholder="Enter Layout ID" value="" />
                                        <button type="button" class="btnUpdateLyt ebutton">Replace</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Trigger Text Slot -->
            <div class="form-content">
                <div class="form-content">
                    <div class="row">
                        <div class="col-ld-6">
                            <div class="form-group">
                                <div class="title">
                                    <p>Trigger Text</p>
                                    <div id="apiText">
                                    </div>
                                </div><br />
                                <div class="form-group">
                                    <div class="input-group col-xs-2">
                                        <select class="form-select" id="replaceTextList">
                                            <option selected>Open this to select text slot. Slot Name | Slot Text</option>
                                        </select>
                                    </div><br />
                                    <div class="input-group">
                                        <input type="text" id="replaceTextInput" class="form-control"
                                            placeholder="Enter Text" value="" />
                                        <button type="button" class="btnReplaceText ebutton">Replace</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Trigger Media Slot -->
                <div class="form-content">
                    <div class="row">
                        <div class="col-ld-6">
                            <div class="form-group">
                                <div class="title">
                                    <p>Trigger Media</p>
                                    <div id="apiMedia"></div>
                                </div><br />
                                <div class="form-group">
                                    <div class="input-group">
                                        <select class="form-select" id="replaceMediaList">
                                            <option selected>Open this to select media slot. Slot Name | Slot Text</option>
                                        </select>
                                    </div><br />
                                    <div class="input-group">
                                        <select class="form-select" id="mediaFilesList">
                                            <option selected>Open this to select media filename</option>
                                        </select>
                                        <button type="button" class="btnReplaceMedia ebutton">Replace</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Device information -->
            <div class="form-content">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <div class="title">
                                <p>Device information</p>
                            </div>
                            <div class="title">
                                <p>CPU</p>
                            </div>
                            <table class="table">
                                <tbody>
                                    <tr>
                                        <td>
                                            <strong>Manufacturer</strong>
                                        </td>
                                        <td>
                                            <div id="sManu"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <strong>Brand</strong>
                                        </td>
                                        <td>
                                            <div id="sBrand"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <strong>Speed</strong>
                                        </td>
                                        <td>
                                            <div id="sSpeed"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <strong>Cores</strong>
                                        </td>
                                        <td>
                                            <div id="sCores"></div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>
                                            <strong>PhysicalCores</strong>
                                        </td>
                                        <td>
                                            <div id="sPhysicalCores"></div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="text/javascript" src="assets/js/cpanel/cpanel.min.js"></script>

</html>
