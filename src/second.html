<!DOCTYPE html>
<html lang="en">

<head>
  <title>eCLess Player</title>

  <script>
    if (typeof module === 'object') {
      window.module = module
      module = undefined
    }
  </script>

  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/jquery.min.js"></script>
  <!-- Enhanced configuration loader -->
  <script src="assets/js/config-loader.js"></script>
  <style>
    body {
      background-image: url("assets/images/ezgif.com-video-to-gif.gif");
      background-size: cover;
      background-repeat: no-repeat;
      background-size: 100%;
      background-attachment: fixed;
      height: 100%;
      width: 100%;
      text-align: center;
      background-color: white;
      color: black;
      font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
      font-size: 15px;
    }

    .clessinfo-parent {
      width: 100%;
      height: auto;
    }

    .title {
      margin: 15px 0 15px 0;
      font-size: 30px;
    }

    .desc {
      text-transform: uppercase;
      display: inline;
      margin: 10px 0 10px 0;
    }

    .company {
      margin: 15px 0 15px 0;
    }

    .result {
      display: inline;
      color: green;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: rgb(0, 66, 0);
      text-align: left;
      vertical-align: top;
      font-size: 5vw;
      color: white;
      white-space: pre-wrap;
      transition: background-color 0.3s ease;
    }

    .bottom.offline {
      background-color: rgb(139, 0, 0); /* Dark red for offline mode */
    }

    .bottom.online {
      background-color: rgb(0, 66, 0); /* Original green for online mode */
    }
  </style>
</head>

<body>
  <div class="bottom"></div>
</body>

<script>
  try {
    var ipcRenderer = window.ipcRenderer
    var remote = window.remote
    var convert = window.xmljs
    var datetime = window.datetime
    var path = window.path
    var os = window.os
    var config = window.config
    
    // Enhanced configuration variables
    var hostserver, dsid, mode
    
    // Wait for config to load
    window.addEventListener('configLoaded', function(event) {
      hostserver = config.hostserver
      dsid = config.id
      mode = config.mode
      console.log('eCLESS: Configuration loaded for second window -', event.detail.source)
      
      // Update display with loaded config
      updateDisplay()
    })
    
    // Fallback for immediate access
    hostserver = config.hostserver
    dsid = config.id
    mode = config.mode
    
  } catch (e) {
    console.warn('error loading configuration: ' + e)
  }
</script>
<script>
  try {
    
    function updateDisplay() {
      if (!config || !remote) return
      
      var render = `<div class="clessinfo-parent">
        <div class="title">eCLESS Player</div>
      <div><div class="desc">Version :</div><div class="result"> ${remote.app.getVersion()}</div><div>
      <div><div class="desc">CLESS Server Website :</div><div class="result"> ${config.hostserver}</div><div>
      <div><div class="desc">Digital Signage ID :</div><div class="result"> ${config.id} </div><div>
      <div><div class="desc">Mode :</div><div class="result"> ${config.mode}</div><div>
      </div>
      <img class="loading-img" src="assets/images/loading.gif">
      `
      //$('body').html(render)
      $('.bottom').html('eCless Player Version : ' + remote.app.getVersion())
      
      if (mode == 'offline') {
        $('.bottom').html('DS : ' + config.id + ' | Mode : ' + config.mode + ' | Offline Mode')
        $('.bottom').removeClass('online').addClass('offline')
      } else {
        $('.bottom').html('DS : ' + config.id + ' | Mode : ' + config.mode)
        $('.bottom').removeClass('offline').addClass('online')
        setTimeout(function () {
          $('.bottom').html('Server : ' + config.hostserver)
        }, 3000)
      }
      
      setTimeout(function () {
        if (typeof(ipcRenderer) != "undefined") {
          ipcRenderer.send('openwindow')
        }
      }, 3000)
    }
    
    // Initialize display with current config (if available)
    if (window.configLoader && window.configLoader.config) {
      updateDisplay()
    }
    
  } catch (e) {
    console.warn('error in second window: ' + e)
  }
</script>

</html>
